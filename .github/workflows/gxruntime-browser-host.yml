name: gxruntime-browser-host

on:
  push:
    paths:
      - 'targets/gcwii-browser-host/**'
      - '.github/workflows/gxruntime-browser-host.yml'
  pull_request:
    paths:
      - 'targets/gcwii-browser-host/**'
      - '.github/workflows/gxruntime-browser-host.yml'

jobs:
  patched-aurora-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned GXRuntime
        shell: bash
        run: |
          set -eux
          git init "$RUNNER_TEMP/gxruntime"
          git -C "$RUNNER_TEMP/gxruntime" remote add origin https://github.com/aharonahdoot/GXRuntime.git
          git -C "$RUNNER_TEMP/gxruntime" fetch --depth 1 origin 8a47b0e8ea7dfc39014a4cff4f7895d88494a611
          git -C "$RUNNER_TEMP/gxruntime" checkout --detach FETCH_HEAD
      - name: Apply browser-host patch
        shell: bash
        run: |
          python targets/gcwii-browser-host/apply.py "$RUNNER_TEMP/gxruntime"
          python targets/gcwii-browser-host/apply_web_deps.py "$RUNNER_TEMP/gxruntime"
          python targets/gcwii-browser-host/apply_imgui_web.py "$RUNNER_TEMP/gxruntime"
          python targets/gcwii-browser-host/apply_webgpu_headers.py "$RUNNER_TEMP/gxruntime"
          python targets/gcwii-browser-host/apply_dawn_native_guards.py "$RUNNER_TEMP/gxruntime"
          python targets/gcwii-browser-host/apply_wasm32_portability.py "$RUNNER_TEMP/gxruntime"
          python targets/gcwii-browser-host/apply_browser_executable.py "$RUNNER_TEMP/gxruntime"
          git -C "$RUNNER_TEMP/gxruntime" diff --check
          git -C "$RUNNER_TEMP/gxruntime" diff --stat
          grep -q 'EmscriptenSurfaceSourceCanvasHTMLSelector' "$RUNNER_TEMP/gxruntime/graphics/aurora/lib/dawn/BackendBinding.cpp"
          grep -q 'emscripten_sleep(0)' "$RUNNER_TEMP/gxruntime/graphics/aurora/lib/webgpu/gpu.cpp"
          grep -q 'emdawnwebgpu' "$RUNNER_TEMP/gxruntime/graphics/aurora/cmake/AuroraDawnProvider.cmake"
          grep -q 'Dear ImGui WebGPU Emscripten compatibility anchor not found' "$RUNNER_TEMP/gxruntime/graphics/aurora/extern/CMakeLists.txt"
          grep -q 'webgpu/webgpu_cpp.h' "$RUNNER_TEMP/gxruntime/graphics/aurora/lib/rmlui.hpp"
          grep -q 'webgpu/webgpu_cpp.h' "$RUNNER_TEMP/gxruntime/graphics/aurora/lib/rmlui/WebGPURenderInterface.hpp"
          grep -q '#ifdef WEBGPU_DAWN' "$RUNNER_TEMP/gxruntime/graphics/aurora/lib/webgpu/gpu.cpp"
          grep -q 'std::numeric_limits<size_t>::max()' "$RUNNER_TEMP/gxruntime/graphics/aurora/lib/gfx/dds_io.cpp"
          grep -q 'add_executable(gxruntime_browser_smoke' "$RUNNER_TEMP/gxruntime/CMakeLists.txt"
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Configure patched GXRuntime
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S "$RUNNER_TEMP/gxruntime" -B "$RUNNER_TEMP/gxruntime-web" -G Ninja \
            -DBUILD_TESTING=OFF \
            -DGXRUNTIME_ENABLE_AURORA=ON \
            -DGXRUNTIME_ENABLE_AURORA_RECOMP=OFF \
            -DAURORA_ENABLE_RMLUI=OFF \
            -DAURORA_SDL3_LINKAGE=static
          IMGUI_WGPU="$RUNNER_TEMP/gxruntime-web/_deps/imgui-src/backends/imgui_impl_wgpu.cpp"
          grep -q 'Exactly one of IMGUI_IMPL_WEBGPU_BACKEND_DAWN or IMGUI_IMPL_WEBGPU_BACKEND_WGPU must be defined' "$IMGUI_WGPU"
          if grep -q 'neither IMGUI_IMPL_WEBGPU_BACKEND_DAWN nor IMGUI_IMPL_WEBGPU_BACKEND_WGPU may be defined if targeting emscripten' "$IMGUI_WGPU"; then
            echo 'stale Dear ImGui Emscripten guard still present' >&2
            exit 1
          fi
      - name: Compile real Aurora core for Wasm
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          LOG="$RUNNER_TEMP/aurora-core-build.log"
          set +e
          cmake --build "$RUNNER_TEMP/gxruntime-web" --target aurora_core -j2 >"$LOG" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- first compiler errors ---'
            grep -n -m 20 -E '(^|: )(fatal )?error:|FAILED:' "$LOG" || true
            echo '--- build tail ---'
            tail -n 120 "$LOG"
            exit "$status"
          fi
          tail -n 40 "$LOG"
      - name: Compile integrated GXRuntime Aurora backend for Wasm
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          LOG="$RUNNER_TEMP/gxruntime-aurora-build.log"
          set +e
          cmake --build "$RUNNER_TEMP/gxruntime-web" --target gxruntime_aurora -j2 >"$LOG" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- first compiler errors ---'
            grep -n -m 20 -E '(^|: )(fatal )?error:|FAILED:' "$LOG" || true
            echo '--- build tail ---'
            tail -n 140 "$LOG"
            exit "$status"
          fi
          tail -n 60 "$LOG"
      - name: Link real browser smoke executable
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          LOG="$RUNNER_TEMP/gxruntime-browser-smoke-build.log"
          set +e
          cmake --build "$RUNNER_TEMP/gxruntime-web" --target gxruntime_browser_smoke -j2 >"$LOG" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- first link/compiler errors ---'
            grep -n -m 30 -E '(^|: )(fatal )?error:|FAILED:|undefined symbol' "$LOG" || true
            echo '--- build tail ---'
            tail -n 180 "$LOG"
            exit "$status"
          fi
          tail -n 80 "$LOG"
          for ext in html js wasm; do
            test -s "$RUNNER_TEMP/gxruntime-web/gxruntime_browser_smoke.$ext"
          done
          ls -lh "$RUNNER_TEMP/gxruntime-web/gxruntime_browser_smoke."{html,js,wasm}
